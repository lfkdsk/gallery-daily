name: daily svg

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  GIT_USER: lfkdsk # change to yourself
  GIT_EMAIL: lfkdsk@gmail.com # change to yourself

jobs:
  build:
    runs-on: ubuntu-latest
    environment: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 没有 npm install / npm ci：build.js 零依赖，只用 Node 内置模块。
      # 以前这一步要装 puppeteer（连带下载一整个 Chromium），是整个 job 里最慢、
      # 也最容易卡住的地方。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test

      - name: Build SVG
        run: node build.js

      - name: Checkout daily branch
        uses: actions/checkout@v4
        continue-on-error: true # 分支还不存在时允许失败
        with:
          ref: daily
          path: daily_public

      - name: Collect files
        run: |
          set -euo pipefail
          test -s daily.svg
          test -s year0.svg
          date_dir="./daily_public/$(date +%Y%m%d)"
          mkdir -p ./daily_public "$date_dir"
          cp -f daily.svg year0.svg ./daily_public/
          cp -f daily.svg "$date_dir/"
          ls -l ./daily_public

      - name: Deploy SVG
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./daily_public
          publish_branch: daily
          github_token: ${{ secrets.GH_PAGES_DEPLOY }}
          user_name: ${{ env.GIT_USER }}
          user_email: ${{ env.GIT_EMAIL }}
          # 定时触发时 github.event.head_commit 是空的，写死一条带日期的消息，
          # 免得历史里全是空标题
          commit_message: 'chore: daily svg'
